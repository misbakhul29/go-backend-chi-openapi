components:
    schemas:
        InternalErrorGetMeResponse:
            properties:
                error:
                    description: Error message
                    example: Internal server error
                    type: string
            type: object
        InternalErrorGetStatusResponse:
            properties:
                error:
                    description: Error message
                    example: Internal server error
                    type: string
            type: object
        NotFoundGetStatusResponse:
            properties:
                error:
                    description: Error message
                    example: Not Found
                    type: string
            type: object
        SuccessGetMeResponse:
            properties:
                email:
                    description: User's email address
                    example: john@example.com
                    format: email
                    type: string
                id:
                    description: User ID
                    example: "123"
                    type: string
                name:
                    description: User's full name
                    example: John Doe
                    type: string
            type: object
        SuccessGetStatusResponse:
            properties:
                status:
                    description: Status indicator
                    enum:
                        - ok
                        - maintenance
                    example: ok
                    type: string
                timestamp:
                    description: ISO 8601 timestamp of the response
                    example: "2023-10-26T10:00:00Z"
                    format: date-time
                    type: string
            type: object
        UnauthorizedGetMeResponse:
            properties:
                error:
                    description: Error message
                    example: Unauthorized
                    type: string
            type: object
    securitySchemes:
        BearerAuth:
            scheme: bearer
            type: http
info:
    description: OpenAPI Swagger Docs
    license:
        name: MIT
        url: https://opensource.org/licenses/MIT
    title: Backend Framework API
    version: 1.0.1
openapi: 3.1.0
paths:
    /auth/me:
        get:
            operationId: getMe
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessGetMeResponse'
                    description: Successfully retrieved user info
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedGetMeResponse'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalErrorGetMeResponse'
                    description: Internal server error
            security:
                - BearerAuth: []
            summary: Get current authenticated user
            tags:
                - Auth
            x-api-version: v1
    /status:
        get:
            operationId: getStatus
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessGetStatusResponse'
                    description: API is healthy and running
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotFoundGetStatusResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalErrorGetStatusResponse'
                    description: Internal server error
            security: []
            summary: Get API Status
            tags:
                - Status
            x-api-version: v1
servers:
    - description: API v1
      url: /api/v1
