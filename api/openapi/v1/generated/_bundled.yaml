components:
    schemas:
        BadRequestResponse:
            properties:
                error:
                    example: invalid request payload
                    type: string
            type: object
        ChangePasswordRequest:
            properties:
                newPassword:
                    example: NewStr0ng#Pass2026
                    type: string
                oldPassword:
                    example: OldStr0ng#Pass2025
                    type: string
                revokeOtherSessions:
                    default: false
                    example: true
                    type: boolean
            required:
                - oldPassword
                - newPassword
            type: object
        ChangeRoleRequest:
            properties:
                role:
                    example: MEMBER
                    type: string
                userId:
                    example: "123"
                    type: string
            required:
                - userId
                - role
            type: object
        ForbiddenResponse:
            properties:
                error:
                    description: Error message
                    example: Forbidden
                    type: string
            type: object
        ForgotPasswordRequest:
            properties:
                email:
                    example: user@example.com
                    format: email
                    type: string
            required:
                - email
            type: object
        InternalErrorGetMeResponse:
            properties:
                error:
                    description: Error message
                    example: Internal server error
                    type: string
            type: object
        InternalErrorGetStatusResponse:
            properties:
                error:
                    description: Error message
                    example: Internal server error
                    type: string
            type: object
        LoginRequest:
            properties:
                email:
                    example: john@example.com
                    format: email
                    type: string
                password:
                    example: secretpassword123
                    type: string
            required:
                - email
                - password
            type: object
        NotFoundGetStatusResponse:
            properties:
                error:
                    description: Error message
                    example: Not Found
                    type: string
            type: object
        NotFoundResponse:
            properties:
                error:
                    description: Error message
                    example: Not found
                    type: string
            type: object
        RefreshRequest:
            properties:
                refreshToken:
                    example: 94fa10d7e6...
                    type: string
            required:
                - refreshToken
            type: object
        RegisterRequest:
            properties:
                email:
                    example: john@example.com
                    format: email
                    type: string
                name:
                    example: John Doe
                    type: string
                password:
                    example: secretpassword123
                    type: string
            required:
                - name
                - email
                - password
            type: object
        ResetPasswordRequest:
            properties:
                newPassword:
                    example: NewStr0ng#Pass2026
                    type: string
                token:
                    example: 94fa10d7e6a5...
                    type: string
            required:
                - token
                - newPassword
            type: object
        SessionItem:
            properties:
                createdAt:
                    format: date-time
                    type: string
                device:
                    example: Chrome on macOS
                    type: string
                expiresAt:
                    format: date-time
                    type: string
                id:
                    example: session-uuid-123
                    type: string
                ipAddress:
                    example: 192.168.1.1
                    type: string
                isCurrent:
                    example: true
                    type: boolean
                lastActiveAt:
                    format: date-time
                    type: string
                userAgent:
                    example: Mozilla/5.0 ...
                    type: string
            required:
                - id
                - isCurrent
                - createdAt
                - expiresAt
            type: object
        SuccessChangePasswordResponse:
            properties:
                message:
                    example: Password successfully updated.
                    type: string
            type: object
        SuccessChangeRoleResponse:
            properties:
                message:
                    example: role successfully updated
                    type: string
            type: object
        SuccessForgotPasswordResponse:
            properties:
                message:
                    example: If your email is registered, you will receive password reset instructions shortly.
                    type: string
            type: object
        SuccessGetMeResponse:
            properties:
                email:
                    description: User's email address
                    example: john@example.com
                    format: email
                    type: string
                id:
                    description: User ID
                    example: "123"
                    type: string
                name:
                    description: User's full name
                    example: John Doe
                    type: string
            type: object
        SuccessGetStatusResponse:
            properties:
                status:
                    description: Status indicator
                    enum:
                        - ok
                        - maintenance
                    example: ok
                    type: string
                timestamp:
                    description: ISO 8601 timestamp of the response
                    example: "2023-10-26T10:00:00Z"
                    format: date-time
                    type: string
            type: object
        SuccessListSessionsResponse:
            properties:
                sessions:
                    items:
                        $ref: '#/components/schemas/SessionItem'
                    type: array
            type: object
        SuccessLoginResponse:
            properties:
                accessToken:
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    type: string
                expiresIn:
                    example: 900
                    type: integer
                refreshToken:
                    example: 94fa10d7e6...
                    type: string
                tokenType:
                    example: Bearer
                    type: string
                user:
                    properties:
                        email:
                            example: john@example.com
                            format: email
                            type: string
                        id:
                            example: "123"
                            type: string
                        name:
                            example: John Doe
                            type: string
                    type: object
            type: object
        SuccessLogoutResponse:
            properties:
                message:
                    example: successfully logged out
                    type: string
            type: object
        SuccessPermissionCheckResponse:
            properties:
                message:
                    example: has debug permission
                    type: string
            type: object
        SuccessRefreshResponse:
            properties:
                accessToken:
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    type: string
                expiresIn:
                    example: 900
                    type: integer
                refreshToken:
                    example: 83bc92e5a1...
                    type: string
                tokenType:
                    example: Bearer
                    type: string
            type: object
        SuccessRegisterResponse:
            properties:
                email:
                    example: john@example.com
                    format: email
                    type: string
                id:
                    example: "123"
                    type: string
                name:
                    example: John Doe
                    type: string
            type: object
        SuccessResetPasswordResponse:
            properties:
                message:
                    example: Password has been successfully reset.
                    type: string
            type: object
        SuccessRevokeAllSessionsResponse:
            properties:
                message:
                    example: sessions successfully revoked
                    type: string
                revokedCount:
                    example: 3
                    type: integer
            type: object
        SuccessRevokeSessionResponse:
            properties:
                message:
                    example: session successfully revoked
                    type: string
            type: object
        UnauthorizedGetMeResponse:
            properties:
                error:
                    description: Error message
                    example: Unauthorized
                    type: string
            type: object
        UnauthorizedResponse:
            properties:
                error:
                    description: Error message
                    example: Unauthorized
                    type: string
            type: object
    securitySchemes:
        BearerAuth:
            scheme: bearer
            type: http
info:
    description: OpenAPI Swagger Docs
    license:
        name: MIT
        url: https://opensource.org/licenses/MIT
    title: Backend Framework API
    version: 1.0.1
openapi: 3.1.0
paths:
    /auth/change-password:
        post:
            operationId: postAuthChangePassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangePasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessChangePasswordResponse'
                    description: Password updated successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Change password for authenticated user
            tags:
                - Auth
            x-api-version: v1
    /auth/change-role:
        post:
            operationId: postAuthChangeRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangeRoleRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessChangeRoleResponse'
                    description: Role successfully updated
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
            security:
                - BearerAuth: []
            summary: Update a user's role
            tags:
                - Auth
            x-api-version: v1
            x-permission:
                action: update
                module: auth
                resource: role
    /auth/forgot-password:
        post:
            operationId: postAuthForgotPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ForgotPasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessForgotPasswordResponse'
                    description: Password reset instructions dispatched
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
            summary: Request password reset instructions
            tags:
                - Auth
            x-api-version: v1
    /auth/login:
        post:
            operationId: postAuthLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessLoginResponse'
                    description: User successfully logged in
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedGetMeResponse'
                    description: Unauthorized
            summary: Authenticate user and retrieve access token
            tags:
                - Auth
            x-api-version: v1
    /auth/logout:
        post:
            operationId: postAuthLogout
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessLogoutResponse'
                    description: User successfully logged out
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedGetMeResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Log out current user and revoke active session
            tags:
                - Auth
            x-api-version: v1
    /auth/me:
        get:
            operationId: getMe
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessGetMeResponse'
                    description: Successfully retrieved user info
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedGetMeResponse'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalErrorGetMeResponse'
                    description: Internal server error
            security:
                - BearerAuth: []
            summary: Get current authenticated user
            tags:
                - Auth
            x-api-version: v1
            x-audit: true
    /auth/refresh:
        post:
            operationId: postAuthRefresh
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessRefreshResponse'
                    description: Tokens refreshed successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedResponse'
                    description: Unauthorized
            summary: Rotate refresh token and issue new token pair
            tags:
                - Auth
            x-api-version: v1
    /auth/register:
        post:
            operationId: postAuthRegister
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessRegisterResponse'
                    description: User successfully registered
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
            summary: Register a new user
            tags:
                - Auth
            x-api-version: v1
    /auth/reset-password:
        post:
            operationId: postAuthResetPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetPasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResetPasswordResponse'
                    description: Password reset successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BadRequestResponse'
                    description: Bad Request
            summary: Reset password using confirmation token
            tags:
                - Auth
            x-api-version: v1
    /auth/sessions:
        delete:
            operationId: deleteAuthSessions
            parameters:
                - description: If true, keep current session active
                  in: query
                  name: exclude_current
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessRevokeAllSessionsResponse'
                    description: Sessions revoked successfully
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Revoke all active sessions for current user
            tags:
                - Auth
            x-api-version: v1
        get:
            operationId: getAuthSessions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessListSessionsResponse'
                    description: Active sessions retrieved successfully
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: List all active sessions for current user
            tags:
                - Auth
            x-api-version: v1
    /auth/sessions/{id}:
        delete:
            operationId: deleteAuthSessionByID
            parameters:
                - description: Session ID to revoke
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessRevokeSessionResponse'
                    description: Session revoked successfully
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotFoundResponse'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: Revoke a specific active session by ID
            tags:
                - Auth
            x-api-version: v1
    /status:
        get:
            operationId: getStatus
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessGetStatusResponse'
                    description: API is healthy and running
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotFoundGetStatusResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InternalErrorGetStatusResponse'
                    description: Internal server error
            security: []
            summary: Get API Status
            tags:
                - System
            x-api-version: v1
    /system/permission-check:
        get:
            operationId: getSystemPermissionCheck
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessPermissionCheckResponse'
                    description: Has permission
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedResponse'
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenResponse'
                    description: Forbidden
            security:
                - BearerAuth: []
            summary: Check if user has debug permissions
            tags:
                - System
            x-api-version: v1
            x-permission:
                action: read
                module: system
                resource: debug
servers:
    - description: API v1
      url: /api/v1
