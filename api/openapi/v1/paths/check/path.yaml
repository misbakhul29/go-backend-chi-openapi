rbac:
  get:
    operationId: checkRbac
    summary: Check RBAC permission middleware
    tags:
      - Check
    x-api-version: v1
    x-permission:
      module: check
      resource: rbac
      action: read
    security:
      - BearerAuth: []
    responses:
      "200":
        description: RBAC verification passed
        content:
          application/json:
            schema:
              $ref: "schema.yaml#/CheckResponse"
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "schema.yaml#/ErrorResponse"

scopes:
  get:
    operationId: checkScopes
    summary: Check data scopes middleware
    tags:
      - Check
    x-api-version: v1
    x-data-scopes:
